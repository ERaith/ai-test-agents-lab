# ============================================================================
# AI TEST GENERATION WORKFLOW (Caller - uses reusable workflow)
# ============================================================================
#
# This minimal workflow calls the reusable workflow from ai-test-agents-lab.
# All logic lives in the central repo - updates there automatically apply here.
#
# IMPORTANT: Replace YOUR_ORG with your actual GitHub org/username in ALL
# places marked below (search for "YOUR_ORG"). GitHub Actions requires literal
# paths in 'uses:' directives - variables cannot be used.
#
# Flow (label-based):
#   1. Add label "generate-tests" → Phase 1: Generate Plan
#   2. Add label "approve-plan"   → Phase 2: Generate Scenarios
#   3. Add label "approve-cases"  → Phase 3: Generate Code (committed to PR)
#
# Setup:
#   1. Replace YOUR_ORG with your org name (4 places in this file)
#   2. Add secrets: ANTHROPIC_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   3. Add variable: S3_BUCKET (and optionally AWS_REGION)
#   4. Create labels: generate-tests, approve-plan, approve-cases, tests-generated
#
# ============================================================================

name: Generate Tests

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

env:
  # TODO: Update this to your organization's ai-test-agents-lab repository
  TEST_AGENTS_REPO: YOUR_ORG/ai-test-agents-lab

jobs:
  # ==========================================================================
  # Phase 1: Generate Test Plan
  # ==========================================================================
  phase-1-plan:
    name: "📝 Phase 1: Generate Test Plan"
    if: github.event.label.name == 'generate-tests'
    uses: YOUR_ORG/ai-test-agents-lab/.github/workflows/test-generation-reusable.yml@main
    with:
      phase: plan
      story_id: pr-${{ github.event.pull_request.number }}
      story_content: |
        # ${{ github.event.pull_request.title }}

        ${{ github.event.pull_request.body }}
      s3_bucket: ${{ vars.S3_BUCKET }}
      s3_prefix: ${{ github.repository }}/pr-${{ github.event.pull_request.number }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  post-plan:
    name: "📝 Post Plan Comment"
    needs: phase-1-plan
    runs-on: ubuntu-latest
    if: github.event.label.name == 'generate-tests'
    steps:
      - name: Post plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ needs.phase-1-plan.outputs.test_plan }}`;
            const content = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;

            const body = `## 📝 Phase 1: Test Plan

            <details>
            <summary>Click to expand</summary>

            ${content}

            </details>

            ---
            **Next:** Add label \`approve-plan\` to continue to Phase 2`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: body
            });

            // Remove trigger label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              name: 'generate-tests'
            }).catch(() => {});

  # ==========================================================================
  # Phase 2: Generate Gherkin Scenarios
  # ==========================================================================
  phase-2-cases:
    name: "🥒 Phase 2: Generate Scenarios"
    if: github.event.label.name == 'approve-plan'
    uses: YOUR_ORG/ai-test-agents-lab/.github/workflows/test-generation-reusable.yml@main
    with:
      phase: cases
      story_id: pr-${{ github.event.pull_request.number }}
      story_content: |
        # ${{ github.event.pull_request.title }}

        ${{ github.event.pull_request.body }}
      s3_bucket: ${{ vars.S3_BUCKET }}
      s3_prefix: ${{ github.repository }}/pr-${{ github.event.pull_request.number }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  post-cases:
    name: "🥒 Post Scenarios Comment"
    needs: phase-2-cases
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approve-plan'
    steps:
      - name: Post scenarios comment
        uses: actions/github-script@v7
        with:
          script: |
            const scenarios = `${{ needs.phase-2-cases.outputs.scenarios }}`;
            const content = scenarios.length > 60000 ? scenarios.substring(0, 60000) + '\n...(truncated)' : scenarios;

            const body = `## 🥒 Phase 2: Gherkin Scenarios

            <details>
            <summary>Click to expand</summary>

            \`\`\`gherkin
            ${content}
            \`\`\`

            </details>

            ---
            **Next:** Add label \`approve-cases\` to continue to Phase 3`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: body
            });

            // Remove trigger label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              name: 'approve-plan'
            }).catch(() => {});

  # ==========================================================================
  # Phase 3: Generate Test Code
  # ==========================================================================
  phase-3-code:
    name: "💻 Phase 3: Generate Tests"
    if: github.event.label.name == 'approve-cases'
    uses: YOUR_ORG/ai-test-agents-lab/.github/workflows/test-generation-reusable.yml@main
    with:
      phase: code
      story_id: pr-${{ github.event.pull_request.number }}
      story_content: |
        # ${{ github.event.pull_request.title }}

        ${{ github.event.pull_request.body }}
      s3_bucket: ${{ vars.S3_BUCKET }}
      s3_prefix: ${{ github.repository }}/pr-${{ github.event.pull_request.number }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  commit-code:
    name: "💻 Commit Test Code"
    needs: phase-3-code
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approve-cases'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts-pr-${{ github.event.pull_request.number }}
          path: ./downloaded-artifacts

      - name: Copy test files
        run: |
          mkdir -p playwright/tests

          # Copy any generated test files
          if [ -d "downloaded-artifacts/playwright/tests" ]; then
            cp -r downloaded-artifacts/playwright/tests/* playwright/tests/ 2>/dev/null || true
          fi

          # Also try the test-artifacts location
          find downloaded-artifacts -name "*.spec.ts" -exec cp {} playwright/tests/ \; 2>/dev/null || true

          echo "Generated test files:"
          ls -la playwright/tests/ || echo "No test files found"

      - name: Commit test code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(ls -A playwright/tests/ 2>/dev/null)" ]; then
            git add playwright/
            git commit -m "🤖 Add generated Playwright tests for PR #${{ github.event.pull_request.number }}" || echo "Nothing to commit"
            git push
          else
            echo "No test files to commit"
          fi

      - name: Post completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const testCode = `${{ needs.phase-3-code.outputs.test_code }}`;
            const preview = testCode.split('\n').slice(0, 50).join('\n');

            const body = `## 💻 Phase 3: Test Code

            ✅ **All phases complete!** Test code committed to this PR.

            <details>
            <summary>Click to expand code</summary>

            \`\`\`typescript
            ${preview}
            \`\`\`

            </details>

            **Next:** Pull changes, review, and merge!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: body
            });

            // Remove trigger label and add completion label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              name: 'approve-cases'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              labels: ['tests-generated']
            });
