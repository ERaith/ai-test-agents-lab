# ============================================================================
# PHASED TEST GENERATION WORKFLOW
# ============================================================================
#
# Label-based workflow for AI-powered test generation.
#
# Flow:
#   1. Add label "generate-tests" → Phase 1: Generate Plan
#   2. Add label "approve-plan"   → Phase 2: Generate Scenarios
#   3. Add label "approve-cases"  → Phase 3: Generate Code → Add "tests-generated"
#
# Labels track state (auto-managed):
#   - generate-tests: Initial trigger (removed after Phase 1)
#   - approve-plan: Triggers Phase 2 (removed after Phase 2)
#   - approve-cases: Triggers Phase 3 (removed after Phase 3)
#   - tests-generated: Final state (all phases complete)
#
# ============================================================================

name: Phased Test Generation

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ==========================================================================
  # Phase 1: Generate Test Plan
  # ==========================================================================
  phase-1-plan:
    name: "📝 Phase 1: Generate Test Plan"
    runs-on: ubuntu-latest
    if: github.event.label.name == 'generate-tests'

    outputs:
      story_id: ${{ steps.extract.outputs.story_id }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS (optional)
        if: vars.S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Load context from S3
        if: vars.S3_BUCKET != ''
        run: |
          aws s3 sync "s3://${{ vars.S3_BUCKET }}/${{ github.repository }}/context/" "./context/" --quiet || true
          aws s3 sync "s3://${{ vars.S3_BUCKET }}/${{ github.repository }}/memory/" "./memory/" --quiet || true

      - name: Extract story and diff
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const pr = context.payload.pull_request;
            const storyId = `pr-${pr.number}`;

            // Save story
            fs.mkdirSync('specs', { recursive: true });
            fs.writeFileSync(`specs/${storyId}.md`, `# ${pr.title}\n\n${pr.body || ''}`);

            // Save diff
            try {
              const diff = execSync(`git diff origin/${pr.base.ref}...HEAD`, { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });
              fs.mkdirSync(`test-artifacts/${storyId}`, { recursive: true });
              fs.writeFileSync(`test-artifacts/${storyId}/pr.diff`, diff);
            } catch (e) {
              console.log('Could not get diff:', e.message);
            }

            core.setOutput('story_id', storyId);
            core.setOutput('pr_number', pr.number);

      - name: Generate test plan
        run: npx tsx src/cli.ts plan ${{ steps.extract.outputs.story_id }} --skip-approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ vars.TEST_FRAMEWORK || 'playwright' }}

      - name: Commit plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add specs/ test-artifacts/
          git commit -m "🤖 Phase 1: Test plan for PR #${{ steps.extract.outputs.pr_number }}"
          git push

      - name: Post plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const storyId = '${{ steps.extract.outputs.story_id }}';
            const prNumber = ${{ steps.extract.outputs.pr_number }};
            const plan = fs.readFileSync(`test-artifacts/${storyId}/test-plan.md`, 'utf8');
            const content = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;

            const body = `## 📝 Phase 1: Test Plan

            <details>
            <summary>Click to expand</summary>

            ${content}

            </details>

            ---
            **Next:** Add label \`approve-plan\` to continue to Phase 2`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Update labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.extract.outputs.pr_number }};
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'generate-tests'
            }).catch(() => {});

  # ==========================================================================
  # Phase 2: Generate Gherkin Scenarios
  # ==========================================================================
  phase-2-cases:
    name: "🥒 Phase 2: Generate Scenarios"
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approve-plan'

    outputs:
      story_id: ${{ steps.setup.outputs.story_id }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        id: setup
        run: |
          echo "story_id=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Verify plan exists
        run: |
          if [ ! -f "test-artifacts/${{ steps.setup.outputs.story_id }}/test-plan.md" ]; then
            echo "❌ Test plan not found. Add 'generate-tests' label first."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate scenarios
        run: npx tsx src/cli.ts cases ${{ steps.setup.outputs.story_id }} --skip-approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit scenarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-artifacts/
          git commit -m "🤖 Phase 2: Scenarios for PR #${{ steps.setup.outputs.pr_number }}"
          git push

      - name: Post scenarios comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const storyId = '${{ steps.setup.outputs.story_id }}';
            const prNumber = ${{ steps.setup.outputs.pr_number }};
            const scenarios = fs.readFileSync(`test-artifacts/${storyId}/scenarios.feature`, 'utf8');
            const content = scenarios.length > 60000 ? scenarios.substring(0, 60000) + '\n...(truncated)' : scenarios;

            const body = `## 🥒 Phase 2: Gherkin Scenarios

            <details>
            <summary>Click to expand</summary>

            ~~~gherkin
            ${content}
            ~~~

            </details>

            ---
            **Next:** Add label \`approve-cases\` to continue to Phase 3`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Update labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.setup.outputs.pr_number }};
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'approve-plan'
            }).catch(() => {});

  # ==========================================================================
  # Phase 3: Generate Test Code
  # ==========================================================================
  phase-3-code:
    name: "💻 Phase 3: Generate Tests"
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approve-cases'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        id: setup
        run: |
          echo "story_id=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Verify scenarios exist
        run: |
          if [ ! -f "test-artifacts/${{ steps.setup.outputs.story_id }}/scenarios.feature" ]; then
            echo "❌ Scenarios not found. Add 'approve-plan' label first."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS (optional)
        if: vars.S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Generate test code
        id: code
        run: |
          FRAMEWORK="${{ vars.TEST_FRAMEWORK || 'playwright' }}"
          npx tsx src/cli.ts code ${{ steps.setup.outputs.story_id }} --skip-approval

          if [ "$FRAMEWORK" = "playwright" ]; then
            echo "test_file=playwright/tests/${{ steps.setup.outputs.story_id }}.spec.ts" >> $GITHUB_OUTPUT
            echo "test_dir=playwright/tests" >> $GITHUB_OUTPUT
          else
            echo "test_file=cypress/e2e/${{ steps.setup.outputs.story_id }}.cy.ts" >> $GITHUB_OUTPUT
            echo "test_dir=cypress/e2e" >> $GITHUB_OUTPUT
          fi
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ vars.TEST_FRAMEWORK || 'playwright' }}

      - name: Commit test code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.code.outputs.test_dir }}/
          git commit -m "🤖 Phase 3: Tests for PR #${{ steps.setup.outputs.pr_number }}"
          git push

      - name: Save context to S3
        if: vars.S3_BUCKET != ''
        run: |
          aws s3 sync "./context/" "s3://${{ vars.S3_BUCKET }}/${{ github.repository }}/context/" --quiet || true
          aws s3 sync "./memory/" "s3://${{ vars.S3_BUCKET }}/${{ github.repository }}/memory/" --quiet || true

      - name: Post completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const storyId = '${{ steps.setup.outputs.story_id }}';
            const prNumber = ${{ steps.setup.outputs.pr_number }};
            const testFile = '${{ steps.code.outputs.test_file }}';
            const code = fs.readFileSync(testFile, 'utf8');
            const preview = code.split('\n').slice(0, 50).join('\n');

            const body = `## 💻 Phase 3: Test Code

            ✅ **All phases complete!**

            <details>
            <summary>Click to expand code</summary>

            ~~~typescript
            ${preview}
            ~~~

            </details>

            ### Generated Files
            - \`${testFile}\`
            - \`test-artifacts/${storyId}/test-plan.md\`
            - \`test-artifacts/${storyId}/scenarios.feature\`

            **Next:** Pull changes, review, and merge!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Update labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.setup.outputs.pr_number }};
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: 'approve-cases'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['tests-generated']
            });
