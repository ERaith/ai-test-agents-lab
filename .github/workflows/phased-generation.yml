# ============================================================================
# PHASED TEST GENERATION WORKFLOW
# ============================================================================
#
# Enterprise-ready workflow with human approval gates at each phase.
#
# Flow:
# 1. PR created/labeled "generate-tests" → Phase 1: Generate Plan
# 2. Human reviews plan → Comments "/approve-plan" → Phase 2: Generate Cases
# 3. Human reviews cases → Comments "/approve-cases" → Phase 3: Generate Code
# 4. Code committed to PR → Ready for final review and merge
#
# Labels track state:
# - generate-tests: Initial trigger
# - awaiting-plan-approval: Plan posted, waiting for human
# - awaiting-cases-approval: Cases posted, waiting for human  
# - tests-generated: All phases complete
#
# ============================================================================

name: 🧪 Phased Test Generation

on:
  pull_request:
    types: [opened, labeled]
  
  issue_comment:
    types: [created]

# Required permissions for the workflow
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ============================================================================
  # PHASE 1: Generate Test Plan
  # ============================================================================
  phase-1-planning:
    name: 📝 Phase 1 - Generate Test Plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      contains(github.event.pull_request.labels.*.name, 'generate-tests') &&
      !contains(github.event.pull_request.labels.*.name, 'awaiting-plan-approval') &&
      !contains(github.event.pull_request.labels.*.name, 'awaiting-cases-approval') &&
      !contains(github.event.pull_request.labels.*.name, 'tests-generated')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract story from PR
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const body = pr.body || '';
            
            // Generate a story ID from PR number
            const storyId = `pr-${pr.number}`;
            
            // Create story content from PR
            const storyContent = `# ${title}\n\n${body}`;
            
            core.setOutput('story_id', storyId);
            core.setOutput('story_content', storyContent);
            core.setOutput('pr_number', pr.number);
            
            console.log(`Story ID: ${storyId}`);
            console.log(`Story Content:\n${storyContent}`);

      - name: Save story to file
        run: |
          mkdir -p specs
          cat > "specs/${{ steps.extract.outputs.story_id }}.md" << 'EOF'
          ${{ steps.extract.outputs.story_content }}
          EOF

      - name: Generate test plan
        id: plan
        run: |
          npx tsx src/cli.ts plan ${{ steps.extract.outputs.story_id }} --skip-approval
          
          # Read the generated plan
          PLAN_PATH="test-artifacts/${{ steps.extract.outputs.story_id }}/test-plan.md"
          if [ -f "$PLAN_PATH" ]; then
            echo "plan_generated=true" >> $GITHUB_OUTPUT
          else
            echo "plan_generated=false" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post plan as PR comment
        if: steps.plan.outputs.plan_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = `test-artifacts/${{ steps.extract.outputs.story_id }}/test-plan.md`;
            const plan = fs.readFileSync(planPath, 'utf8');
            
            // Truncate if too long for GitHub comment
            const maxLength = 60000;
            const truncatedPlan = plan.length > maxLength 
              ? plan.substring(0, maxLength) + '\n\n... (truncated, see artifacts for full plan)'
              : plan;
            
            const body = `## 📝 Phase 1: AI-Generated Test Plan
            
            <details>
            <summary>Click to expand test plan</summary>
            
            ${truncatedPlan}
            
            </details>
            
            ---
            
            ### ✅ Next Steps
            
            1. **Review** the test plan above
            2. **Request changes** by commenting on specific items
            3. **Approve** by commenting: \`/approve-plan\`
            
            > ⏸️ *Workflow paused - waiting for plan approval*
            
            ---
            *Phase 1 of 3 • Generated by Agentic Testing Workflow*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.extract.outputs.pr_number }},
              body: body
            });

      - name: Upload plan artifact
        if: steps.plan.outputs.plan_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-plan-${{ steps.extract.outputs.story_id }}
          path: test-artifacts/${{ steps.extract.outputs.story_id }}/test-plan.md
          retention-days: 30

      - name: Update labels
        if: steps.plan.outputs.plan_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.extract.outputs.pr_number }};
            
            // Remove trigger label, add waiting label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'generate-tests'
              });
            } catch (e) {
              console.log('Label generate-tests not found, continuing...');
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['awaiting-plan-approval']
            });

  # ============================================================================
  # PHASE 2: Generate Gherkin Scenarios (triggered by /approve-plan)
  # ============================================================================
  phase-2-cases:
    name: 🥒 Phase 2 - Generate Test Cases
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve-plan')
    
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('pr_number', context.issue.number);
            core.setOutput('story_id', `pr-${context.issue.number}`);
            
            // Check if correct label exists
            const hasLabel = pr.data.labels.some(l => l.name === 'awaiting-plan-approval');
            core.setOutput('has_correct_label', hasLabel.toString());

      - name: Verify approval is valid
        if: steps.pr.outputs.has_correct_label != 'true'
        run: |
          echo "PR does not have 'awaiting-plan-approval' label. Skipping."
          exit 0

      - name: Checkout code
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}

      - name: Setup Node.js
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.pr.outputs.has_correct_label == 'true'
        run: npm ci

      - name: Download test plan artifact
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-plan-${{ steps.pr.outputs.story_id }}
          path: test-artifacts/${{ steps.pr.outputs.story_id }}
        continue-on-error: true

      - name: Extract story from PR
        if: steps.pr.outputs.has_correct_label == 'true'
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const storyContent = `# ${pr.data.title}\n\n${pr.data.body || ''}`;
            core.setOutput('story_content', storyContent);

      - name: Save story to file
        if: steps.pr.outputs.has_correct_label == 'true'
        run: |
          mkdir -p specs
          cat > "specs/${{ steps.pr.outputs.story_id }}.md" << 'EOF'
          ${{ steps.extract.outputs.story_content }}
          EOF

      - name: Generate Gherkin scenarios
        if: steps.pr.outputs.has_correct_label == 'true'
        id: cases
        run: |
          npx tsx src/cli.ts cases ${{ steps.pr.outputs.story_id }} --skip-approval
          
          CASES_PATH="test-artifacts/${{ steps.pr.outputs.story_id }}/scenarios.feature"
          if [ -f "$CASES_PATH" ]; then
            echo "cases_generated=true" >> $GITHUB_OUTPUT
          else
            echo "cases_generated=false" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post scenarios as PR comment
        if: steps.pr.outputs.has_correct_label == 'true' && steps.cases.outputs.cases_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const casesPath = `test-artifacts/${{ steps.pr.outputs.story_id }}/scenarios.feature`;
            const cases = fs.readFileSync(casesPath, 'utf8');
            
            const maxLength = 60000;
            const truncatedCases = cases.length > maxLength 
              ? cases.substring(0, maxLength) + '\n\n... (truncated)'
              : cases;
            
            const body = `## 🥒 Phase 2: AI-Generated Gherkin Scenarios
            
            <details>
            <summary>Click to expand scenarios</summary>
            
            \`\`\`gherkin
            ${truncatedCases}
            \`\`\`
            
            </details>
            
            ---
            
            ### ✅ Next Steps
            
            1. **Review** the Gherkin scenarios above
            2. **Request changes** by commenting on specific scenarios
            3. **Approve** by commenting: \`/approve-cases\`
            
            > ⏸️ *Workflow paused - waiting for cases approval*
            
            ---
            *Phase 2 of 3 • Generated by Agentic Testing Workflow*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: body
            });

      - name: Upload scenarios artifact
        if: steps.pr.outputs.has_correct_label == 'true' && steps.cases.outputs.cases_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ steps.pr.outputs.story_id }}
          path: test-artifacts/${{ steps.pr.outputs.story_id }}/scenarios.feature
          retention-days: 30

      - name: Update labels
        if: steps.pr.outputs.has_correct_label == 'true' && steps.cases.outputs.cases_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.pr_number }};
            
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'awaiting-plan-approval'
              });
            } catch (e) {
              console.log('Label not found, continuing...');
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['awaiting-cases-approval']
            });

  # ============================================================================
  # PHASE 3: Generate Code (triggered by /approve-cases)
  # ============================================================================
  phase-3-code:
    name: 💻 Phase 3 - Generate Test Code
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve-cases')
    
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('pr_number', context.issue.number);
            core.setOutput('story_id', `pr-${context.issue.number}`);
            
            const hasLabel = pr.data.labels.some(l => l.name === 'awaiting-cases-approval');
            core.setOutput('has_correct_label', hasLabel.toString());

      - name: Verify approval is valid
        if: steps.pr.outputs.has_correct_label != 'true'
        run: |
          echo "PR does not have 'awaiting-cases-approval' label. Skipping."
          exit 0

      - name: Checkout code
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.pr.outputs.has_correct_label == 'true'
        run: npm ci

      - name: Download scenarios artifact
        if: steps.pr.outputs.has_correct_label == 'true'
        uses: actions/download-artifact@v4
        with:
          name: scenarios-${{ steps.pr.outputs.story_id }}
          path: test-artifacts/${{ steps.pr.outputs.story_id }}
        continue-on-error: true

      - name: Generate Cypress code
        if: steps.pr.outputs.has_correct_label == 'true'
        id: code
        run: |
          npx tsx src/cli.ts code ${{ steps.pr.outputs.story_id }} --skip-approval
          
          CODE_PATH="cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts"
          if [ -f "$CODE_PATH" ]; then
            echo "code_generated=true" >> $GITHUB_OUTPUT
          else
            echo "code_generated=false" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit generated code to PR
        if: steps.pr.outputs.has_correct_label == 'true' && steps.code.outputs.code_generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add test-artifacts/ cypress/e2e/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Generated test artifacts for PR #${{ steps.pr.outputs.pr_number }}
            
            Files:
            - test-artifacts/${{ steps.pr.outputs.story_id }}/test-plan.md
            - test-artifacts/${{ steps.pr.outputs.story_id }}/scenarios.feature
            - cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts
            
            Generated by Agentic Testing Workflow"
            
            git push
          fi

      - name: Post completion comment
        if: steps.pr.outputs.has_correct_label == 'true' && steps.code.outputs.code_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const codePath = `cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts`;
            
            let codePreview = '';
            try {
              const code = fs.readFileSync(codePath, 'utf8');
              const lines = code.split('\n').slice(0, 50).join('\n');
              codePreview = lines + (code.split('\n').length > 50 ? '\n// ... (truncated)' : '');
            } catch (e) {
              codePreview = '// Code file not found';
            }
            
            const body = `## 💻 Phase 3: AI-Generated Test Code
            
            ✅ **All phases complete!** Test code has been committed to this PR.
            
            <details>
            <summary>Click to expand generated code (preview)</summary>
            
            \`\`\`typescript
            ${codePreview}
            \`\`\`
            
            </details>
            
            ---
            
            ### 📁 Generated Files
            
            | File | Description |
            |------|-------------|
            | \`test-artifacts/${{ steps.pr.outputs.story_id }}/test-plan.md\` | Test strategy & risk analysis |
            | \`test-artifacts/${{ steps.pr.outputs.story_id }}/scenarios.feature\` | Gherkin scenarios |
            | \`cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts\` | Cypress test code |
            
            ### ✅ Next Steps
            
            1. **Review** the generated code
            2. **Adjust** selectors and implementation details as needed
            3. **Run tests** locally: \`npx cypress run --spec cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts\`
            4. **Merge** when ready!
            
            ---
            *Phase 3 of 3 • Generated by Agentic Testing Workflow* ✨`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: body
            });

      - name: Update labels
        if: steps.pr.outputs.has_correct_label == 'true' && steps.code.outputs.code_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.pr_number }};
            
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'awaiting-cases-approval'
              });
            } catch (e) {
              console.log('Label not found, continuing...');
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['tests-generated']
            });

      - name: Upload code artifact
        if: steps.pr.outputs.has_correct_label == 'true' && steps.code.outputs.code_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-code-${{ steps.pr.outputs.story_id }}
          path: cypress/e2e/${{ steps.pr.outputs.story_id }}.cy.ts
          retention-days: 30
