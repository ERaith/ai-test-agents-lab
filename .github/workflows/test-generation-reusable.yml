# ============================================================================
# REUSABLE TEST GENERATION WORKFLOW
# ============================================================================
#
# Central workflow that can be called from other repositories.
# Provides AI-powered test generation with:
# - PR diff analysis for context
# - S3-based context persistence across PRs
# - Playwright test output
# - Cross-story memory and learning
#
# Usage from other repositories:
#
#   jobs:
#     generate-tests:
#       uses: owner/ai-test-agents-lab/.github/workflows/test-generation-reusable.yml@main
#       with:
#         phase: 'plan'  # or 'cases', 'code', 'full'
#         story_id: 'pr-123'
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#
# ============================================================================

name: Test Generation (Reusable)

on:
  workflow_call:
    inputs:
      # Phase to run: plan, cases, code, or full (all phases)
      phase:
        description: 'Phase to run: plan, cases, code, or full'
        required: true
        type: string
        default: 'plan'

      # Story identifier (e.g., 'pr-123' or 'JIRA-456')
      story_id:
        description: 'Story identifier'
        required: true
        type: string

      # Story content (PR body, Jira description, etc.)
      story_content:
        description: 'Story content in markdown'
        required: false
        type: string
        default: ''

      # PR diff content for context analysis
      diff_content:
        description: 'Git diff content for analysis'
        required: false
        type: string
        default: ''

      # Test framework: playwright or cypress
      test_framework:
        description: 'Test framework to use'
        required: false
        type: string
        default: 'playwright'

      # S3 bucket for context persistence
      s3_bucket:
        description: 'S3 bucket for context storage'
        required: false
        type: string
        default: ''

      # S3 prefix for repository scoping
      s3_prefix:
        description: 'S3 prefix (defaults to repository name)'
        required: false
        type: string
        default: ''

      # Skip approval gates (for CI/automation)
      skip_approval:
        description: 'Skip human approval gates'
        required: false
        type: boolean
        default: true

      # Node.js version
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'

      # AWS region
      aws_region:
        description: 'AWS region for S3'
        required: false
        type: string
        default: 'us-east-1'

      # Caller repository context (for comments/labels/commits)
      caller_repo:
        description: 'Caller repository (owner/repo)'
        required: false
        type: string
        default: ''

      pr_number:
        description: 'PR number for comments/labels'
        required: false
        type: number
        default: 0

      pr_head_ref:
        description: 'PR head branch for commits'
        required: false
        type: string
        default: ''

      trigger_label:
        description: 'Label that triggered this phase (will be removed)'
        required: false
        type: string
        default: ''

    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Claude'
        required: true
      AWS_ACCESS_KEY_ID:
        description: 'AWS access key ID (optional, for S3)'
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS secret access key (optional, for S3)'
        required: false
      CALLER_GITHUB_TOKEN:
        description: 'GitHub token from caller for PR comments/labels/commits'
        required: false

    outputs:
      test_plan:
        description: 'Generated test plan (Phase 1)'
        value: ${{ jobs.generate.outputs.test_plan }}
      scenarios:
        description: 'Generated Gherkin scenarios (Phase 2)'
        value: ${{ jobs.generate.outputs.scenarios }}
      test_code:
        description: 'Generated test code (Phase 3)'
        value: ${{ jobs.generate.outputs.test_code }}
      analysis:
        description: 'PR diff analysis results'
        value: ${{ jobs.generate.outputs.analysis }}

jobs:
  generate:
    name: Generate Tests
    runs-on: ubuntu-latest

    outputs:
      test_plan: ${{ steps.plan.outputs.content }}
      scenarios: ${{ steps.cases.outputs.content }}
      test_code: ${{ steps.code.outputs.content }}
      analysis: ${{ steps.analyze.outputs.content }}

    steps:
      - name: Checkout ai-test-agents-lab
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-test-agents-lab
          path: ai-test-agents
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        working-directory: ai-test-agents
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.test_framework == 'playwright'
        working-directory: ai-test-agents
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        if: inputs.s3_bucket != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup story file
        id: setup
        working-directory: ai-test-agents
        run: |
          mkdir -p specs

          if [ -n "${{ inputs.story_content }}" ]; then
            echo '${{ inputs.story_content }}' > "specs/${{ inputs.story_id }}.md"
          else
            echo "# ${{ inputs.story_id }}" > "specs/${{ inputs.story_id }}.md"
            echo "" >> "specs/${{ inputs.story_id }}.md"
            echo "Story content not provided." >> "specs/${{ inputs.story_id }}.md"
          fi

          echo "story_path=specs/${{ inputs.story_id }}.md" >> $GITHUB_OUTPUT

      - name: Analyze PR diff
        id: analyze
        if: inputs.diff_content != ''
        working-directory: ai-test-agents
        run: |
          # Save diff to file
          echo '${{ inputs.diff_content }}' > /tmp/pr.diff

          # Run diff analysis
          npx tsx -e "
            import { DiffAnalyzer, formatAnalysisAsMarkdown } from './src/analysis/index.js';
            import * as fs from 'fs';

            const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');
            const analyzer = new DiffAnalyzer();
            const analysis = await analyzer.analyzeDiff(diff);

            // Save analysis results
            fs.mkdirSync('test-artifacts/${{ inputs.story_id }}', { recursive: true });
            fs.writeFileSync('test-artifacts/${{ inputs.story_id }}/diff-analysis.json', JSON.stringify(analysis, null, 2));
            fs.writeFileSync('test-artifacts/${{ inputs.story_id }}/diff-analysis.md', formatAnalysisAsMarkdown(analysis));

            console.log('Analysis complete');
            console.log('Changed files:', analysis.changedFiles.length);
            console.log('Related files:', analysis.relatedFiles.length);
            console.log('Suggested test types:', analysis.suggestedTestTypes.join(', '));
          "

          if [ -f "test-artifacts/${{ inputs.story_id }}/diff-analysis.md" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "test-artifacts/${{ inputs.story_id }}/diff-analysis.md" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Load context from S3
        if: inputs.s3_bucket != ''
        working-directory: ai-test-agents
        run: |
          S3_PREFIX="${{ inputs.s3_prefix }}"
          if [ -z "$S3_PREFIX" ]; then
            S3_PREFIX="${{ github.repository }}"
          fi

          # Try to download existing context and memory
          aws s3 sync "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/context/" "./context/" --quiet || true
          aws s3 sync "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/memory/" "./memory/" --quiet || true

          # For phases 2 and 3, also download previously generated artifacts
          if [ "${{ inputs.phase }}" = "cases" ] || [ "${{ inputs.phase }}" = "code" ]; then
            echo "Downloading artifacts from previous phases..."
            mkdir -p "test-artifacts/${{ inputs.story_id }}"
            aws s3 sync "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/artifacts/${{ inputs.story_id }}/" \
              "./test-artifacts/${{ inputs.story_id }}/" --quiet || true
            echo "Downloaded artifacts:"
            ls -la "test-artifacts/${{ inputs.story_id }}/" 2>/dev/null || echo "No artifacts found"
          fi

          echo "Loaded context from S3"
          ls -la context/ 2>/dev/null || echo "No context directory"
          ls -la memory/ 2>/dev/null || echo "No memory directory"
        env:
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Generate test plan (Phase 1)
        id: plan
        if: inputs.phase == 'plan' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: |
          SKIP_FLAG=""
          if [ "${{ inputs.skip_approval }}" = "true" ]; then
            SKIP_FLAG="--skip-approval"
          fi

          npx tsx src/cli.ts plan ${{ inputs.story_id }} $SKIP_FLAG

          if [ -f "test-artifacts/${{ inputs.story_id }}/test-plan.md" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "test-artifacts/${{ inputs.story_id }}/test-plan.md" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          STORAGE_PROVIDER: ${{ inputs.s3_bucket != '' && 's3' || 'local' }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_PREFIX: ${{ inputs.s3_prefix || github.repository }}
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Generate test cases (Phase 2)
        id: cases
        if: inputs.phase == 'cases' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: |
          # Verify test plan exists
          if [ ! -f "test-artifacts/${{ inputs.story_id }}/test-plan.md" ]; then
            echo "Test plan not found - run plan phase first"
            exit 1
          fi

          SKIP_FLAG=""
          if [ "${{ inputs.skip_approval }}" = "true" ]; then
            SKIP_FLAG="--skip-approval"
          fi

          npx tsx src/cli.ts cases ${{ inputs.story_id }} $SKIP_FLAG

          if [ -f "test-artifacts/${{ inputs.story_id }}/scenarios.feature" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "test-artifacts/${{ inputs.story_id }}/scenarios.feature" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          STORAGE_PROVIDER: ${{ inputs.s3_bucket != '' && 's3' || 'local' }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_PREFIX: ${{ inputs.s3_prefix || github.repository }}
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Generate test code (Phase 3)
        id: code
        if: inputs.phase == 'code' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: |
          # Verify scenarios exist
          if [ ! -f "test-artifacts/${{ inputs.story_id }}/scenarios.feature" ]; then
            echo "Scenarios not found - run cases phase first"
            exit 1
          fi

          SKIP_FLAG=""
          if [ "${{ inputs.skip_approval }}" = "true" ]; then
            SKIP_FLAG="--skip-approval"
          fi

          npx tsx src/cli.ts code ${{ inputs.story_id }} $SKIP_FLAG

          # Find the generated test file
          TEST_DIR="playwright/tests"
          if [ "${{ inputs.test_framework }}" = "cypress" ]; then
            TEST_DIR="cypress/e2e"
          fi

          TEST_FILE=$(find $TEST_DIR -name "*${{ inputs.story_id }}*" -type f 2>/dev/null | head -1)
          if [ -n "$TEST_FILE" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "$TEST_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          STORAGE_PROVIDER: ${{ inputs.s3_bucket != '' && 's3' || 'local' }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_PREFIX: ${{ inputs.s3_prefix || github.repository }}
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Save context to S3
        if: inputs.s3_bucket != '' && always()
        working-directory: ai-test-agents
        run: |
          S3_PREFIX="${{ inputs.s3_prefix }}"
          if [ -z "$S3_PREFIX" ]; then
            S3_PREFIX="${{ github.repository }}"
          fi

          # Upload context and memory
          aws s3 sync "./context/" "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/context/" --quiet || true
          aws s3 sync "./memory/" "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/memory/" --quiet || true

          # Upload artifacts for this story
          aws s3 sync "./test-artifacts/${{ inputs.story_id }}/" \
            "s3://${{ inputs.s3_bucket }}/${S3_PREFIX}/artifacts/${{ inputs.story_id }}/" --quiet || true

          echo "Saved context to S3"
        env:
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ inputs.story_id }}
          path: |
            ai-test-agents/test-artifacts/${{ inputs.story_id }}/
            ai-test-agents/playwright/tests/
            ai-test-agents/cypress/e2e/
          if-no-files-found: ignore

  # ============================================================================
  # Post-generation: Handle PR comments, labels, and commits
  # ============================================================================
  post-generate:
    name: Update PR
    needs: generate
    runs-on: ubuntu-latest
    if: inputs.caller_repo != '' && inputs.pr_number != 0

    steps:
      - name: Post comment and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CALLER_GITHUB_TOKEN }}
          script: |
            const [owner, repo] = '${{ inputs.caller_repo }}'.split('/');
            const prNumber = ${{ inputs.pr_number }};
            const phase = '${{ inputs.phase }}';
            const triggerLabel = '${{ inputs.trigger_label }}';

            // Get outputs from generate job
            const testPlan = `${{ needs.generate.outputs.test_plan }}`;
            const scenarios = `${{ needs.generate.outputs.scenarios }}`;
            const testCode = `${{ needs.generate.outputs.test_code }}`;

            let body = '';
            let nextLabel = '';

            if (phase === 'plan') {
              const content = testPlan.length > 60000 ? testPlan.substring(0, 60000) + '\n...(truncated)' : testPlan;
              body = `## 📝 Phase 1: Test Plan

            <details>
            <summary>Click to expand</summary>

            ${content}

            </details>

            ---
            **Next:** Add label \`approve-plan\` to continue to Phase 2`;
            } else if (phase === 'cases') {
              const content = scenarios.length > 60000 ? scenarios.substring(0, 60000) + '\n...(truncated)' : scenarios;
              body = `## 🥒 Phase 2: Gherkin Scenarios

            <details>
            <summary>Click to expand</summary>

            \`\`\`gherkin
            ${content}
            \`\`\`

            </details>

            ---
            **Next:** Add label \`approve-cases\` to continue to Phase 3`;
            } else if (phase === 'code') {
              const preview = testCode.split('\n').slice(0, 50).join('\n');
              body = `## 💻 Phase 3: Test Code

            ✅ **All phases complete!** Test code committed to this PR.

            <details>
            <summary>Click to expand code</summary>

            \`\`\`typescript
            ${preview}
            \`\`\`

            </details>

            **Next:** Pull changes, review, and merge!`;
              nextLabel = 'tests-generated';
            }

            // Post comment
            if (body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

            // Remove trigger label
            if (triggerLabel) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: triggerLabel
              }).catch(() => {});
            }

            // Add completion label for phase 3
            if (nextLabel) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [nextLabel]
              });
            }

      - name: Download test artifacts (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts-${{ inputs.story_id }}
          path: ./artifacts

      - name: Checkout caller repo for commit (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo }}
          ref: ${{ inputs.pr_head_ref }}
          token: ${{ secrets.CALLER_GITHUB_TOKEN }}
          path: caller-repo

      - name: Commit test files (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        run: |
          cd caller-repo
          mkdir -p playwright/tests

          # Copy test files from downloaded artifacts
          find ../artifacts -name "*.spec.ts" -exec cp {} playwright/tests/ \; 2>/dev/null || true

          # Check if there are files to commit
          if [ -n "$(ls -A playwright/tests/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add playwright/
            git commit -m "🤖 Add generated Playwright tests for PR #${{ inputs.pr_number }}" || echo "Nothing to commit"
            git push
            echo "✅ Committed test files"
          else
            echo "⚠️ No test files to commit"
          fi
