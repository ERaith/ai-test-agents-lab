# ==============================================================================
# REUSABLE TEST GENERATION WORKFLOW
# ==============================================================================
#
# Central workflow that can be called from other repositories.
# Logic lives in scripts/ci/ - this file is just wiring.
#
# Usage from other repositories:
#
#   jobs:
#     generate-tests:
#       uses: owner/ai-test-agents-lab/.github/workflows/test-generation-reusable.yml@main
#       with:
#         phase: 'plan'
#         story_id: 'pr-123'
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# ==============================================================================

name: Test Generation (Reusable)

on:
  workflow_call:
    inputs:
      phase:
        description: 'Phase to run: plan, cases, code, or full'
        required: true
        type: string
        default: 'plan'

      story_id:
        description: 'Story identifier'
        required: true
        type: string

      story_content:
        description: 'Story content in markdown'
        required: false
        type: string
        default: ''

      test_framework:
        description: 'Test framework: playwright or cypress'
        required: false
        type: string
        default: 'playwright'

      s3_bucket:
        description: 'S3 bucket for context storage'
        required: false
        type: string
        default: ''

      s3_prefix:
        description: 'S3 prefix (defaults to repository name)'
        required: false
        type: string
        default: ''

      skip_approval:
        description: 'Skip human approval gates'
        required: false
        type: boolean
        default: true

      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'

      aws_region:
        description: 'AWS region for S3'
        required: false
        type: string
        default: 'us-east-1'

      caller_repo:
        description: 'Caller repository (owner/repo)'
        required: false
        type: string
        default: ''

      pr_number:
        description: 'PR number for comments/labels'
        required: false
        type: number
        default: 0

      pr_head_ref:
        description: 'PR head branch for commits'
        required: false
        type: string
        default: ''

      trigger_label:
        description: 'Label that triggered this phase (will be removed)'
        required: false
        type: string
        default: ''

    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Claude'
        required: true
      AWS_ACCESS_KEY_ID:
        description: 'AWS access key ID (optional, for S3)'
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS secret access key (optional, for S3)'
        required: false
      CALLER_GITHUB_TOKEN:
        description: 'GitHub token from caller for PR comments/labels/commits'
        required: false

    outputs:
      test_plan:
        description: 'Generated test plan (Phase 1)'
        value: ${{ jobs.generate.outputs.test_plan }}
      scenarios:
        description: 'Generated Gherkin scenarios (Phase 2)'
        value: ${{ jobs.generate.outputs.scenarios }}
      test_code:
        description: 'Generated test code (Phase 3)'
        value: ${{ jobs.generate.outputs.test_code }}

jobs:
  generate:
    name: Generate Tests
    runs-on: ubuntu-latest

    outputs:
      test_plan: ${{ steps.plan.outputs.content }}
      scenarios: ${{ steps.cases.outputs.content }}
      test_code: ${{ steps.code.outputs.content }}

    steps:
      - name: Checkout ai-test-agents-lab
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-test-agents-lab
          path: ai-test-agents
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        working-directory: ai-test-agents
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.test_framework == 'playwright'
        working-directory: ai-test-agents
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        if: inputs.s3_bucket != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup story file
        id: setup
        working-directory: ai-test-agents
        run: ./scripts/ci/setup-story.sh "${{ inputs.story_id }}"
        env:
          STORY_CONTENT: ${{ inputs.story_content }}

      - name: Download context from S3
        if: inputs.s3_bucket != ''
        working-directory: ai-test-agents
        run: ./scripts/ci/sync-s3.sh download "${{ inputs.story_id }}" "${{ inputs.phase }}"
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_PREFIX: ${{ inputs.s3_prefix || github.repository }}
          AWS_REGION: ${{ inputs.aws_region }}

      # Checkout caller repo to check for patch files (.test-patches/pr-<number>.md)
      - name: Checkout caller repo (for patch files)
        if: inputs.caller_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo }}
          ref: ${{ inputs.pr_head_ref }}
          token: ${{ secrets.CALLER_GITHUB_TOKEN || github.token }}
          path: caller-repo
          sparse-checkout: |
            .test-patches
            .github/test-patches

      - name: Generate test plan (Phase 1)
        id: plan
        if: inputs.phase == 'plan' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: ./scripts/ci/run-phase.sh plan "${{ inputs.story_id }}" ${{ inputs.skip_approval && '--skip-approval' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          CALLER_REPO_PATH: ${{ inputs.caller_repo != '' && '../caller-repo' || '' }}

      - name: Generate test cases (Phase 2)
        id: cases
        if: inputs.phase == 'cases' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: ./scripts/ci/run-phase.sh cases "${{ inputs.story_id }}" ${{ inputs.skip_approval && '--skip-approval' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          CALLER_REPO_PATH: ${{ inputs.caller_repo != '' && '../caller-repo' || '' }}

      - name: Generate test code (Phase 3)
        id: code
        if: inputs.phase == 'code' || inputs.phase == 'full'
        working-directory: ai-test-agents
        run: ./scripts/ci/run-phase.sh code "${{ inputs.story_id }}" ${{ inputs.skip_approval && '--skip-approval' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
          CALLER_REPO_PATH: ${{ inputs.caller_repo != '' && '../caller-repo' || '' }}

      - name: Upload context to S3
        if: inputs.s3_bucket != '' && always()
        working-directory: ai-test-agents
        run: ./scripts/ci/sync-s3.sh upload "${{ inputs.story_id }}"
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_PREFIX: ${{ inputs.s3_prefix || github.repository }}
          AWS_REGION: ${{ inputs.aws_region }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ inputs.story_id }}
          path: |
            ai-test-agents/test-artifacts/${{ inputs.story_id }}/
            ai-test-agents/playwright/tests/
            ai-test-agents/cypress/e2e/
          if-no-files-found: ignore

  # ==============================================================================
  # Post-generation: Handle PR comments, labels, and commits
  # ==============================================================================
  post-generate:
    name: Update PR
    needs: generate
    runs-on: ubuntu-latest
    if: inputs.caller_repo != '' && inputs.pr_number != 0

    steps:
      - name: Checkout ai-test-agents-lab
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-test-agents-lab
          path: ai-test-agents
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        working-directory: ai-test-agents
        run: npm ci

      - name: Post PR comment
        working-directory: ai-test-agents
        run: npx tsx scripts/ci/post-pr-comment.ts
        env:
          GITHUB_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
          CALLER_REPO: ${{ inputs.caller_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PHASE: ${{ inputs.phase }}
          TRIGGER_LABEL: ${{ inputs.trigger_label }}
          TEST_PLAN: ${{ needs.generate.outputs.test_plan }}
          SCENARIOS: ${{ needs.generate.outputs.scenarios }}
          TEST_CODE: ${{ needs.generate.outputs.test_code }}

      - name: Download test artifacts (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts-${{ inputs.story_id }}
          path: ./artifacts

      - name: Checkout caller repo (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo }}
          ref: ${{ inputs.pr_head_ref }}
          token: ${{ secrets.CALLER_GITHUB_TOKEN }}
          path: caller-repo

      - name: Commit test files (Phase 3 only)
        if: inputs.phase == 'code' && inputs.pr_head_ref != ''
        run: ./ai-test-agents/scripts/ci/commit-tests.sh ./caller-repo "${{ inputs.pr_number }}"
        env:
          TEST_FRAMEWORK: ${{ inputs.test_framework }}
