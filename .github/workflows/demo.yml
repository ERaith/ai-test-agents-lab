# ============================================================================
# DEMO WORKFLOW - For showcasing the agentic testing system
# ============================================================================
#
# This workflow is designed for demos and interviews. It:
# 1. Takes a story ID as input
# 2. Runs the full agentic workflow
# 3. Uploads all generated artifacts
# 4. Provides a summary with download links
#
# To run: Actions → Demo Workflow → Run workflow → Enter story ID
# ============================================================================

name: 🎬 Demo Workflow

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g., story-003-shopping-cart)'
        required: true
        default: 'story-003-shopping-cart'
        type: choice
        options:
          - story-001-delete-user
          - story-002-user-registration
          - story-003-shopping-cart
          - story-004-password-reset
          - story-005-product-search
          - story-006-user-profile
          - story-007-checkout

jobs:
  demo:
    name: 🤖 Generate Tests for ${{ github.event.inputs.story_id }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Display story content
        run: |
          echo "## 📖 Story: ${{ github.event.inputs.story_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          cat "specs/${{ github.event.inputs.story_id }}.md" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Phase 1 - Generate Test Plan
        run: |
          echo "## 📝 Phase 1: Test Planning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          npm run agent:plan -- ${{ github.event.inputs.story_id }} --skip-approval
          
          echo "✅ Test plan generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 🥒 Phase 2 - Generate Gherkin Scenarios
        run: |
          echo "## 🥒 Phase 2: Gherkin Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          npm run agent:cases -- ${{ github.event.inputs.story_id }} --skip-approval
          
          echo "✅ Gherkin scenarios generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 💻 Phase 3 - Generate Cypress Code
        run: |
          echo "## 💻 Phase 3: Cypress Code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          npm run agent:code -- ${{ github.event.inputs.story_id }} --skip-approval
          
          echo "✅ Cypress tests generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 📊 Display Results
        run: |
          echo "## 📊 Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Test Plan" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          head -100 "test-artifacts/${{ github.event.inputs.story_id }}/test-plan.md" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Gherkin Scenarios" >> $GITHUB_STEP_SUMMARY
          echo '```gherkin' >> $GITHUB_STEP_SUMMARY
          head -80 "test-artifacts/${{ github.event.inputs.story_id }}/scenarios.feature" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Cypress Code (first 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```typescript' >> $GITHUB_STEP_SUMMARY
          head -100 "cypress/e2e/${{ github.event.inputs.story_id }}.cy.ts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-${{ github.event.inputs.story_id }}
          path: |
            test-artifacts/${{ github.event.inputs.story_id }}/
            cypress/e2e/${{ github.event.inputs.story_id }}.cy.ts
          retention-days: 30

      - name: Final summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Demo Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download the generated artifacts from the Actions tab.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`test-plan.md\` | Comprehensive test strategy with risk analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| \`scenarios.feature\` | Executable Gherkin specifications |" >> $GITHUB_STEP_SUMMARY
          echo "| \`*.cy.ts\` | Ready-to-run Cypress test code |" >> $GITHUB_STEP_SUMMARY
