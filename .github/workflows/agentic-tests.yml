# ============================================================================
# AGENTIC TEST GENERATION WORKFLOW
# ============================================================================
# 
# This workflow automatically generates test artifacts when:
# 1. A new story file is added to specs/
# 2. A PR is labeled with "generate-tests"
# 3. Manually triggered via workflow_dispatch
#
# The workflow follows a human-in-the-loop pattern:
# - Phase 1: Generate test plan and post for review
# - Phase 2: On approval, generate Gherkin scenarios
# - Phase 3: Generate Cypress test code
# - Phase 4: Commit generated files to PR branch
# ============================================================================

name: Agentic Test Generation

on:
  pull_request:
    types: [labeled, opened, synchronize]
    paths:
      - 'specs/**/*.md'
  
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID to generate tests for (e.g., story-001-delete-user)'
        required: true
        type: string
      skip_approval:
        description: 'Skip approval gates (for testing)'
        required: false
        type: boolean
        default: false
      phase:
        description: 'Which phase to run'
        required: true
        type: choice
        options:
          - full
          - plan-only
          - cases-only
          - code-only
        default: full

concurrency:
  group: agentic-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # JOB 1: Detect which stories need test generation
  # ============================================================================
  detect-stories:
    name: 📋 Detect Stories
    runs-on: ubuntu-latest
    outputs:
      stories: ${{ steps.find-stories.outputs.stories }}
      has_stories: ${{ steps.find-stories.outputs.has_stories }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find stories to process
        id: find-stories
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STORIES='["${{ github.event.inputs.story_id }}"]'
          elif [ "${{ github.event.action }}" = "labeled" ] && [ "${{ github.event.label.name }}" = "generate-tests" ]; then
            STORIES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | \
              grep '^specs/.*\.md$' | \
              sed 's|specs/||;s|\.md||' | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            STORIES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | \
              grep '^specs/.*\.md$' | \
              sed 's|specs/||;s|\.md||' | \
              jq -R -s -c 'split("\n") | map(select(length > 0))') || STORIES='[]'
          fi
          
          echo "stories=$STORIES" >> $GITHUB_OUTPUT
          
          if [ "$STORIES" = "[]" ] || [ -z "$STORIES" ]; then
            echo "has_stories=false" >> $GITHUB_OUTPUT
          else
            echo "has_stories=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # JOB 2: Generate Test Plan
  # ============================================================================
  generate-plan:
    name: 📝 Generate Test Plan
    needs: detect-stories
    if: needs.detect-stories.outputs.has_stories == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        story: ${{ fromJson(needs.detect-stories.outputs.stories) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate test plan
        run: npx tsx src/cli.ts plan ${{ matrix.story }} --skip-approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload test plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-plan-${{ matrix.story }}
          path: test-artifacts/${{ matrix.story }}/test-plan.md
          retention-days: 30

  # ============================================================================
  # JOB 3: Generate Gherkin Scenarios
  # ============================================================================
  generate-scenarios:
    name: 🥒 Generate Scenarios
    needs: [detect-stories, generate-plan]
    if: |
      always() && 
      needs.detect-stories.outputs.has_stories == 'true' &&
      needs.generate-plan.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        story: ${{ fromJson(needs.detect-stories.outputs.stories) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download test plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan-${{ matrix.story }}
          path: test-artifacts/${{ matrix.story }}

      - name: Generate Gherkin scenarios
        run: npx tsx src/cli.ts cases ${{ matrix.story }} --skip-approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload scenarios artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.story }}
          path: test-artifacts/${{ matrix.story }}/scenarios.feature
          retention-days: 30

  # ============================================================================
  # JOB 4: Generate Cypress Code
  # ============================================================================
  generate-code:
    name: 💻 Generate Test Code
    needs: [detect-stories, generate-scenarios]
    if: |
      always() && 
      needs.detect-stories.outputs.has_stories == 'true' &&
      needs.generate-scenarios.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        story: ${{ fromJson(needs.detect-stories.outputs.stories) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download scenarios
        uses: actions/download-artifact@v4
        with:
          name: scenarios-${{ matrix.story }}
          path: test-artifacts/${{ matrix.story }}

      - name: Generate Cypress test code
        run: npx tsx src/cli.ts code ${{ matrix.story }} --skip-approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload test code artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-code-${{ matrix.story }}
          path: cypress/e2e/${{ matrix.story }}.cy.ts
          retention-days: 30

  # ============================================================================
  # JOB 5: Summary Report
  # ============================================================================
  summary:
    name: 📊 Summary
    needs: [detect-stories, generate-plan, generate-scenarios, generate-code]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🤖 Agentic Test Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect Stories | ${{ needs.detect-stories.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate Plans | ${{ needs.generate-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate Scenarios | ${{ needs.generate-scenarios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate Code | ${{ needs.generate-code.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stories processed:** ${{ needs.detect-stories.outputs.stories }}" >> $GITHUB_STEP_SUMMARY
