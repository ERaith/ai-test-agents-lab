# ============================================================================
# CI WORKFLOW - Validates code quality on every push/PR
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test workflow (simulation mode)
        run: npm run test:workflow -- story-001-delete-user
        env:
          # No API key = simulation mode
          ANTHROPIC_API_KEY: ''

  # Optional: Run actual Cypress tests if they exist
  cypress:
    name: 🧪 Cypress Tests
    runs-on: ubuntu-latest
    needs: validate
    if: false  # Disabled until app is available
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: 'http://localhost:3000'
